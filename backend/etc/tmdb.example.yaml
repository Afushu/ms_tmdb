Name: ms-tmdb-api
Host: 0.0.0.0
Port: 8888
# 请求处理超时时间（毫秒），默认 30 秒
Timeout: 30000
# 允许保存较大的季明细 payload（默认 1MB）
MaxBytes: 8388608
# 对外访问地址（可选）。配置后，本地上传图片 /uploads/xxx 会改写为完整 URL，
# 供跨域调用方（如 media-saber）直接访问；留空则保持相对路径。
# PublicBaseURL: "http://192.168.50.10:18080"

# PostgreSQL 配置
Postgres:
  Host: "127.0.0.1"
  Port: 5432
  User: "postgres"
  Password: "postgres"
  DBName: "ms_tmdb"
  SSLMode: "disable"

# TMDB 配置
Tmdb:
  ApiKey: "your_tmdb_api_key"
  BaseURL: "https://api.tmdb.org/3"
  DefaultLanguage: "zh-CN"
  RateLimit: 40
  ProxyURL: ""
  LocalWriteEnabled: true
  AutoSync:
    Enabled: true
    CronExpr: "*/30 * * * *"
    Mode: "update_unmodified"
    BatchSize: 50
    StartDelaySecond: 15
  Log:
    RetentionDays: 7
    BodyLimitBytes: 1048576
    # 清理后执行 VACUUM FULL 归还磁盘；高峰期可设 false
    ReclaimSpace: true
