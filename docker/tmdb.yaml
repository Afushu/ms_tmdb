Name: ms-tmdb-api
Host: 0.0.0.0
Port: 8888
# 请求处理超时时间（毫秒），默认 30 秒
Timeout: 30000
# 对外访问地址（可选）。配置后，本地上传图片 /uploads/xxx 会改写为完整 URL，
# 供跨域调用方（如 media-saber）直接访问；留空则保持相对路径。
# PublicBaseURL: "http://192.168.50.10:18080"

# PostgreSQL 配置（请改成你的外部数据库地址）
Postgres:
  Host: "host.docker.internal"
  Port: 5432
  User: "postgres"
  Password: "postgres"
  DBName: "ms_tmdb"
  SSLMode: "disable"

# TMDB 配置（上线前请替换为你自己的密钥）
Tmdb:
  ApiKey: ""
  BaseURL: "https://api.tmdb.org/3"
  DefaultLanguage: "zh-CN"
  RateLimit: 40
  ProxyURL: ""
  LocalWriteEnabled: true
  AutoSync:
    Enabled: true
    CronExpr: "*/30 * * * *"
    Mode: "update_unmodified"
    BatchSize: 50
    StartDelaySecond: 15
  Log:
    RetentionDays: 7
    BodyLimitBytes: 1048576
    ReclaimSpace: true
